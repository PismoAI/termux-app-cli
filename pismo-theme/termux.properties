# Pismo CLI Terminal Configuration
# Clean, minimal, user-friendly

# Use custom extra keys (simplified)
extra-keys = [['ESC','/','-','HOME','UP','END'],['TAB','CTRL','ALT','LEFT','DOWN','RIGHT']]

# Bell behavior (silent - less jarring)
bell-character=ignore

# Fullscreen mode (immersive experience)
fullscreen=false

# Use black keyboard (matches dark theme)
use-black-ui=true

# Terminal margin for better readability
terminal-margin-horizontal=8
terminal-margin-vertical=8
